services:

  rabbitmq:
    image: rabbitmq:3-management
    env_file: 
     - ./config/.env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq 
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmqctl status || exit 1"]
      interval: 30s 
      timeout: 10s
      retries: 5
      start_period: 60s

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data 
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: on-failure

  celery_worker:
    build: .
    volumes:
      - ./data:/app/data
    command: celery -A worker worker --loglevel=info --pool=solo --concurrency=4
    env_file: ./config/.env
    deploy:
      resources:
       limits:
         memory: 512M
       reservations:
         memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker inspect ping -d celery@$$HOSTNAME"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  flower:
    image: mher/flower
    build: .
    command: celery -A worker flower --address=0.0.0.0 --port=5555
    ports:
      - "5555:5555"
    env_file: ./config/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      
  client:
    build: .
    command: python client.py 
    env_file: ./config/.env
    volumes:
      - ./data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_healthy

volumes:
  rabbitmq_data:
  redis_data: